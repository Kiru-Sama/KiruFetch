name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64，无法签名" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/KiruFetch-${GITHUB_REF_NAME#v}.apk"

      - name: Extract changelog
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "")
          body += "\n\n---\n\n完整说明见 [CHANGELOG.md](https://github.com/Kiru-Sama/KiruFetch/blob/main/CHANGELOG.md)。"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          print(body[:200])
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: KiruFetch ${{ github.ref_name }}
          files: out/*.apk
          body_path: release-notes.md
          fail_on_unmatched_files: true
